name: Prepare dependency PRs
on:
  push:
    branches: [automation/prepare-dependency-prs]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - chore/content-maintenance
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm update serialize-javascript --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - name: Format changed source and documentation
        run: |
          git diff --name-only origin/main...HEAD -z -- '*.json' '*.md' '*.mjs' | xargs -0 -r npx prettier --write --ignore-unknown
          npx prettier --write package-lock.json
      - name: Commit generated lockfile and formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          for path in scripts README.md CONTRIBUTING.md SECURITY.md; do
            if [ -e "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            HUSKY=0 git commit -m "chore: regenerate dependency lockfile and format changes"
            git push origin "HEAD:${{ matrix.branch }}"
          fi
      - run: npm run typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run prettier:check
      - name: Content regression and legacy comparison
        if: matrix.branch == 'chore/content-maintenance'
        run: |
          npm install --prefix "$RUNNER_TEMP/frontmatter-baseline" --ignore-scripts --no-audit --no-fund gray-matter@4.0.3
          LEGACY_MATTER_PATH="$RUNNER_TEMP/frontmatter-baseline/node_modules/gray-matter/index.js" npm run test:content
      - name: Typography regression and CSS comparison
        if: matrix.branch == 'experiment/typography-selector-parser-7'
        run: |
          npm install --prefix "$RUNNER_TEMP/typography-baseline" --ignore-scripts --no-audit --no-fund @tailwindcss/typography@0.5.20
          BASELINE_TYPOGRAPHY_PATH="$RUNNER_TEMP/typography-baseline/node_modules/@tailwindcss/typography/src/index.js" npm run test:typography
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: Render blog and legal pages
        if: matrix.branch == 'experiment/typography-selector-parser-7'
        run: npm run test:prose
      - run: npm run build-storybook
      - name: Full dependency audit
        if: always()
        continue-on-error: true
        run: npm audit
  node-support:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.19.0', '22.13.0', 22]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/node-support-documentation
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run prettier:check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook
