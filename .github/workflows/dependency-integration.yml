name: Validate combined dependency changes
on:
  push:
    branches: [automation/validate-dependency-integration]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Merge the four proposed branches locally
        run: |
          git config user.name 'Dependency validation'
          git config user.email 'validation@users.noreply.github.com'
          for branch in chore/next-16.4.2 chore/content-maintenance experiment/typography-selector-parser-7 fix/node-support-documentation; do
            git merge --no-edit "origin/$branch"
          done
      - run: npm install --global npm@10.9.9
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - run: npm run typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run prettier:check
      - name: Content baseline comparison
        run: |
          npm install --prefix "$RUNNER_TEMP/frontmatter-baseline" --ignore-scripts --no-audit --no-fund gray-matter@4.0.3
          LEGACY_MATTER_PATH="$RUNNER_TEMP/frontmatter-baseline/node_modules/gray-matter/index.js" npm run test:content
      - name: Typography baseline comparison
        run: |
          npm install --prefix "$RUNNER_TEMP/typography-baseline" --ignore-scripts --no-audit --no-fund @tailwindcss/typography@0.5.20
          BASELINE_TYPOGRAPHY_PATH="$RUNNER_TEMP/typography-baseline/node_modules/@tailwindcss/typography/src/index.js" npm run test:typography
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:prose
      - run: npm run build-storybook
      - name: Record remaining audit alerts
        if: always()
        continue-on-error: true
        run: npm audit
